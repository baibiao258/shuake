name: 刷课

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # 允许在 Actions 页面手动触发

jobs:
  Start:
    runs-on: ubuntu-latest
    steps:
      - name: 拷贝代码
        uses: actions/checkout@v4

      - name: 设置python环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖包
        run: |
          python -m pip install --upgrade pip
          pip install -r ./requirements.txt

      - name: Run main.py
        # 账号密码/题库凭据全部通过 GitHub Actions Secrets 以环境变量注入，
        # 不在仓库留下任何明文敏感信息
        env:
          CHAOXING_USERNAME: ${{ secrets.CHAOXING_USERNAME }}
          CHAOXING_PASSWORD: ${{ secrets.CHAOXING_PASSWORD }}
          CHAOXING_COURSE_LIST: ${{ secrets.CHAOXING_COURSE_LIST }}
          SKIP_WORK: ${{ secrets.SKIP_WORK }}
          TIKU_PROVIDER: ${{ secrets.TIKU_PROVIDER }}
          TIKU_TOKENS: ${{ secrets.TIKU_TOKENS }}
          TIKU_URL: ${{ secrets.TIKU_URL }}
          TIKU_ENDPOINT: ${{ secrets.TIKU_ENDPOINT }}
          TIKU_KEY: ${{ secrets.TIKU_KEY }}
          TIKU_MODEL: ${{ secrets.TIKU_MODEL }}
          SILICONFLOW_KEY: ${{ secrets.SILICONFLOW_KEY }}
          SILICONFLOW_MODEL: ${{ secrets.SILICONFLOW_MODEL }}
          SILICONFLOW_ENDPOINT: ${{ secrets.SILICONFLOW_ENDPOINT }}
        run: python main.py